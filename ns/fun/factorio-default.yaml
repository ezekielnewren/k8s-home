apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio-default
  namespace: fun
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: factorio-default
  template:
    metadata:
      labels:
        app: factorio-default
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: factorio-default
        image: factoriotools/factorio:2.0.14
        env:
        - name: UPDATE_MODS_ON_START
          value: "false"
        - name: USERNAME
          valueFrom:
            configMapKeyRef:
              name: factorio-username
              key: USERNAME
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: factorio-token
              key: TOKEN
        ports:
        - containerPort: 34197
          protocol: UDP
        volumeMounts:
        - name: factorio-default-storage
          mountPath: /factorio
      volumes:
      - name: factorio-default-storage
        persistentVolumeClaim:
          claimName: factorio-default-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: factorio-default
  namespace: fun
spec:
  type: NodePort
  selector:
    app: factorio-default
  ports:
  - protocol: UDP
    port: 34197
    targetPort: 34197
    nodePort: 34197

